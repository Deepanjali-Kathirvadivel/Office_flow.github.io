<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeFlow - Complaint Detail</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1>Complaint Details</h1>
        <div class="nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="bills.html">Bills</a>
            <a href="couriers.html">Couriers</a>
            <a href="assets.html">Assets</a>
            <a href="complaints.html">Complaints</a>
            <div class="user-info">
                <span id="userName"></span>
                <button class="btn btn-secondary" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card" id="complaintDetailCard">
            <div class="loading">Loading...</div>
        </div>

        <div class="card" id="statusUpdateCard" style="display: none;">
            <div class="card-header">
                <h2>Update Status</h2>
            </div>
            <form id="statusUpdateForm">
                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status" name="status" required>
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="statusComments">Comments</label>
                    <textarea id="statusComments" name="comments" rows="3"></textarea>
                </div>
                <div class="form-group" id="resolutionNoteGroup" style="display: none;">
                    <label for="resolutionNote">Resolution Note *</label>
                    <textarea id="resolutionNote" name="resolution_note" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Update Status</button>
                <div id="statusMessage" class="error-message"></div>
            </form>
        </div>

        <div class="card" id="historyCard" style="display: none;">
            <div class="card-header">
                <h2>Status History</h2>
            </div>
            <div class="table-container">
                <table id="historyTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Action</th>
                            <th>Performed By</th>
                            <th>Old Status</th>
                            <th>New Status</th>
                            <th>Comments</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/complaint-detail.js"></script>
</body>
</html>
