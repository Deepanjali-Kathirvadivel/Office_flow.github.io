<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeFlow - Complaints</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1>Complaint Register</h1>
        <div class="nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="bills.html">Bills</a>
            <a href="couriers.html">Couriers</a>
            <a href="assets.html">Assets</a>
            <a href="complaints.html" class="active">Complaints</a>
            <div class="user-info">
                <span id="userName"></span>
                <button class="btn btn-secondary" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>Submit Complaint</h2>
            </div>
            <form id="complaintForm">
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="">Select category</option>
                        <option value="IT">IT</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="HR">HR</option>
                        <option value="Security">Security</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="priority">Priority *</label>
                    <select id="priority" name="priority" required>
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                        <option value="Critical">Critical</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" name="description" rows="5" required></textarea>
                </div>
                <div class="form-group">
                    <label>Attachment</label>
                    <input type="file" id="attachmentFile">
                    <div id="attachmentPreview" style="margin-top: 10px;"></div>
                </div>
                <button type="submit" class="btn btn-primary">Submit Complaint</button>
                <div id="complaintMessage" class="error-message"></div>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>My Complaints</h2>
            </div>
            <div class="table-container">
                <table id="complaintsTable">
                    <thead>
                        <tr>
                            <th>Ticket Number</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Assigned To</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="complaintsTableBody">
                        <tr>
                            <td colspan="7" class="loading">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/complaints.js"></script>
</body>
</html>
